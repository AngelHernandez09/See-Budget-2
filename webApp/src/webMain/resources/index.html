<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeBudget2</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script>
        // RNF-07 (selector de idioma, agregado en el chat): navigator.languages
        // es de solo lectura, así que Compose Resources no puede consultarlo
        // para forzar un idioma elegido en Ajustes (independiente del idioma
        // real del navegador). Este parche intercepta el getter para devolver
        // window.__customLocale cuando está seteado (ver LocalAppLocale.js.kt /
        // LocalAppLocale.wasmJs.kt), y el comportamiento normal del navegador
        // en caso contrario. Mecanismo oficial documentado en
        // https://kotlinlang.org/docs/multiplatform/compose-resource-environment.html
        var currentLanguagesImplementation = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        var newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                } else {
                    return currentLanguagesImplementation.get.apply(this);
                }
            }
        });
        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation);
    </script>
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
